<script>
const pestanaIngresar = document.getElementById("pestana-ingresar");
const pestanaCrear = document.getElementById("pestana-crear");
const nombre = document.getElementById("nombre-cuenta");
const labelNombre = document.getElementById("label-nombre");
const botonCuenta = document.getElementById("boton-cuenta");
const mensaje = document.getElementById("mensaje-cuenta");
let modoCrear = false;

function cambiarModo(crear) {
    modoCrear = crear;
    nombre.classList.toggle("oculto", !crear);
    labelNombre.classList.toggle("oculto", !crear);
    nombre.required = crear;
    botonCuenta.textContent = crear ? "Crear cuenta" : "Iniciar sesión";
    pestanaCrear.classList.toggle("activa", crear);
    pestanaIngresar.classList.toggle("activa", !crear);
    mensaje.textContent = "";
}

pestanaIngresar.addEventListener("click", function() {
    cambiarModo(false);
});

pestanaCrear.addEventListener("click", function() {
    cambiarModo(true);
});

document.getElementById("form-cuenta").addEventListener("submit", function(evento) {
    evento.preventDefault();

    if (modoCrear) {
        mensaje.textContent = "El formulario está completo. Para registrar la cuenta de verdad, hay que conectarlo a un sistema de usuarios.";
    } else {
        mensaje.textContent = "El formulario está completo. Para iniciar sesión, necesitás conectar un sistema de usuarios.";
    }
});
</script>
